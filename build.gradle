plugins {
    id 'java'
    id 'application'
}

group = 'com.paperpiper'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

compileJava {
    options.encoding = 'UTF-8'
}

tasks.named('test').configure {
    // Language servers triggers while doing running the diff algorithm. 
    // slows down my VS code :( 
    onlyIf { gradle.startParameter.taskNames.any { it == 'test' || it == ':test' } }
}

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.4'
    jomlVersion = '1.10.7'
    libbulletjmeVersion = '21.2.1'
    imguiVersion = '1.86.11'
}

dependencies {
    // Physics Engine - Libbulletjme (modern Bullet physics for Java)
    // The base JAR contains natives for all platforms
    implementation "com.github.stephengold:Libbulletjme:${libbulletjmeVersion}"
    
    // LWJGL BOM for version management
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    
    // LWJGL Core
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-assimp'
    
    // LWJGL Native libraries - All platforms for distribution
    runtimeOnly "org.lwjgl:lwjgl::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-assimp::natives-windows"
    
    runtimeOnly "org.lwjgl:lwjgl::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-assimp::natives-linux"
    
    runtimeOnly "org.lwjgl:lwjgl::natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-assimp::natives-macos"
    
    runtimeOnly "org.lwjgl:lwjgl::natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-assimp::natives-macos-arm64"
    
    // JOML - Math library for 3D graphics
    implementation "org.joml:joml:${jomlVersion}"
    
    // ImGui - Immediate Mode GUI for overlays and debug panels
    implementation "io.github.spair:imgui-java-binding:${imguiVersion}"
    implementation "io.github.spair:imgui-java-lwjgl3:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-windows:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-linux:${imguiVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-macos:${imguiVersion}"

    // ROS2 client
    implementation 'io.github.lambdaprime:jros2client:12.0'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.paperpiper.PaperPiper'
}

run {
    if (project.hasProperty('debug')) {
        jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=localhost:5005'
    }
}

tasks.register('runRossServer', JavaExec) {
    group = 'application'
    description = 'Run ROSS protocol server (TCP/UDP + optional ROS2 bridge)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.paperpiper.server.RossServerMain'
    if (project.hasProperty('serverArgs')) {
        args(project.property('serverArgs').toString().split(' '))
    } else {
        args('5000', '1')
    }
}

tasks.register('runRossClient', JavaExec) {
    group = 'application'
    description = 'Run ROSS client (TCP/UDP)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.paperpiper.client.RossClientMain'
    if (project.hasProperty('clientArgs')) {
        args(project.property('clientArgs').toString().split(' '))
    } else {
        args('127.0.0.1', '5000', 'drone-1', '55000')
    }
}

tasks.register('runWithServer', JavaExec) {
    group = 'application'
    description = 'Run the full simulation with an embedded ROSS server on port 5000'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.paperpiper.PaperPiper'
    args('--server')
}

test {
    useJUnitPlatform()
    

    jvmArgs = [
        '-Djava.awt.headless=true',
        '-Dorg.lwjgl.glfw.Window=false',
        '-Dopengl.allowSoftwareRenderer=true'
    ]
    
    forkEvery = 1  // Fork a new JVM for each test to prevent cascading crashes
}

jar {
    manifest {
        attributes 'Main-Class': 'com.paperpiper.PaperPiper'
    }
}

// Task to create fat JAR with all dependencies
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.paperpiper.PaperPiper'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

// Task to download Libbulletjme 
task downloadBulletNatives { 
    doLast {
        def os = System.getProperty("os.name").toLowerCase()
        def arch = System.getProperty("os.arch").toLowerCase()
        
        def libName
        def zipName
        
        if (os.contains("win")) {
            libName = "bulletjme.dll"
            zipName = "Windows64ReleaseSp_bulletjme.dll"
        } else if (os.contains("linux")) {
            libName = "libbulletjme.so"
            zipName = "Linux64ReleaseSp_libbulletjme.so"
        } else if (os.contains("mac")) {
            libName = "libbulletjme.dylib"
            if (arch.contains("aarch64") || arch.contains("arm")) {
                zipName = "MacOSX_ARM64ReleaseSp_libbulletjme.dylib"
            } else {
                zipName = "MacOSX64ReleaseSp_libbulletjme.dylib"
            }
        } else {
            throw new GradleException("Unsupported OS: " + os)
        }
        
        def nativesDir = file("$buildDir/resources/main/natives")
        nativesDir.mkdirs()
        
        def libFile = file("$nativesDir/$libName")
        
        if (!libFile.exists()) {
            def downloadUrl = "https://github.com/stephengold/Libbulletjme/releases/download/${libbulletjmeVersion}/$zipName"
            println "Downloading Bullet physics native library from: $downloadUrl"
            
            new URL(downloadUrl).withInputStream { input ->
                libFile.withOutputStream { output ->
                    output << input
                }
            }
            println "Downloaded native library to: $libFile"
        } else {
            println "Native library already exists: $libFile"
        }
    }
}

build.dependsOn downloadBulletNatives
jar.dependsOn downloadBulletNatives
fatJar.dependsOn downloadBulletNatives
run.dependsOn downloadBulletNatives
runWithServer.dependsOn downloadBulletNatives

task downloadMonocraftFont {
    doLast {
        def fontsDir = file("$buildDir/resources/main/Fonts")
        fontsDir.mkdirs()

        def fontFile = file("$fontsDir/Monocraft-nerd-fonts-patched.ttc")

        if (!fontFile.exists()) {
            def downloadUrl = "https://github.com/IdreesInc/Monocraft/releases/download/v4.2.1/Monocraft-nerd-fonts-patched.ttc"
            println "Downloading Monocraft font from: $downloadUrl"

            new URL(downloadUrl).withInputStream { input ->
                fontFile.withOutputStream { output ->
                    output << input
                }
            }
            println "Downloaded font to: $fontFile"
        } else {
            println "Font already exists: $fontFile"
        }
    }
}

build.dependsOn downloadMonocraftFont
jar.dependsOn downloadMonocraftFont
fatJar.dependsOn downloadMonocraftFont
run.dependsOn downloadMonocraftFont
runWithServer.dependsOn downloadMonocraftFont
